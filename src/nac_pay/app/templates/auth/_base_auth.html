<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}NAC Pay Tracker{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}?v={{ static_v }}">
  {% include "_pwa_head.html" %}
</head>
<body class="auth-body">
  <main class="auth-shell">
    <div class="auth-brand"><a href="/" style="text-decoration:none;color:inherit;">NAC Pay Tracker</a></div>

      <a href="/privacy">Privacy</a> · <a href="/terms">Terms</a>
    </p>
  </main>
  {% include "_pwa_scripts.html" %}
</body>
</html>
